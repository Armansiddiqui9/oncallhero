name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Unit + workflow + replay tests (no LLM, no network)
        run: uv run pytest tests/unit tests/workflow tests/replay -q
        env:
          TEMPORAL_TEST_SERVER_DOWNLOAD: "true"

      - name: Cache Temporal test server
        uses: actions/cache@v4
        with:
          path: ~/.temporalio
          key: temporal-test-server-${{ runner.os }}
